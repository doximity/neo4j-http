version: 2.1

executors:
  ruby:
    parameters:
      version:
        type: string
    resource_class: small
    docker:
      - image: cimg/ruby:<< parameters.version >>
        environment:
          - BUNDLE_VERSION: "4.0.23"
          - NEO4J_URL: "http://127.0.0.1:7474"
      - image: neo4j:4.4.12-enterprise
        environment:
          NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
          NEO4J_AUTH: "none"
          NEO4J_dbms_allow__upgrade: "true"
          NEO4J_dbms_jvm_additional: "-Xms128m -Xmx512m"
          NEO4J_dbms_logs_query_enabled: "true"
          NEO4J_dbms_memory_heap_max__size: "256M"
          NEO4J_dbms_memory_pagecache_size: "256M"

# yaml anchor filters
master_only: &master_only
  filters:
    branches:
      only: master
    tags:
      ignore: /.*/
pr_only: &pr_only
  filters:
    branches:
      ignore: master
    tags:
      ignore: /.*/
version_tags_only: &version_tags_only
  filters:
    branches:
      ignore: /.*/
    tags:
      only: /^v.*/

jobs:
  build:
    parameters:
      ruby_version:
        type: string
    executor:
      name: ruby
      version: << parameters.ruby_version >>
    steps:
      - checkout
      - run:
          name: Install Bundler specific version
          command: |
            gem install bundler --version "${BUNDLE_VERSION}" --force
      - run:
          name: Configure Bundler
          command: |
            bundle config set --local path 'vendor/bundle'
            bundle config set --local frozen 'true'
            bundle config set --local jobs '4'
            bundle config set --local retry '3'
      - run:
          name: Install Ruby Dependencies
          command: bundle install --local
      - run:
          name: Wait for neo4j
          command: |
            for attempt in $(seq 1 120); do
              if nc -z 127.0.0.1 7474; then
                echo 'Neo4j container is up'
                exit 0
              fi
              echo 'Waiting for Neo4j container...'
              sleep 1
            done
            echo 'Neo4j container did not start in time'
            exit 1
      - run:
          name: Run Tests
          command: bundle exec rake ci:specs
      - store_test_results:
          name: Store test results
          path: tmp/test-results
      - run:
          name: Run StandardRB formatting
          command: bundle exec rake ci:standardrb
      - persist_to_workspace:
          root: .
          paths:
            - vendor/bundle

workflows:
  version: 2

  trunk:
    jobs:
      - build:
          <<: *master_only
          matrix:
            parameters:
              ruby_version: ["3.3", "3.4", "4.0"]

  pull-requests:
    jobs:
      - build:
          <<: *pr_only
          matrix:
            parameters:
              ruby_version: ["3.3", "3.4", "4.0"]

  final-release:
    jobs:
      - build:
          <<: *version_tags_only
          matrix:
            parameters:
              ruby_version: ["3.3", "3.4", "4.0"]
